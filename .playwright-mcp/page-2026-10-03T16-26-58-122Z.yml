            - region "Explore Innflow" [ref=f6e110]:
              - heading "More time for your team. Less time chasing tasks." [level=2] [ref=f6e111]: More time for your team.Less time chasing tasks.
              - paragraph [ref=f6e112]: Bring your property operations into one connected flow.
              - generic [ref=f6e113]:
