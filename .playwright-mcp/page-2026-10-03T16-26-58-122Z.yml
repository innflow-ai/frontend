              - heading "Frequently Asked Questions" [level=2] [ref=f6e211]
              - heading "Is there a single winner in OpenAI vs Anthropic for property management?" [level=3] [ref=f6e212]
              - paragraph [ref=f6e213]: "No. Score your own case types. Many portfolios will use more than one model: a faster one for classification, a stronger one for long documents. The workflow should allow that routing. A single-vendor mandate is a procurement convenience, not an operations design."
              - heading "Should we let staff use ChatGPT or Claude directly on resident email?" [level=3] [ref=f6e214]
              - paragraph [ref=f6e215]: Not as the production path. Consumer chat creates an unmanaged data path and no approval record. If people need drafts, give them a workflow that already has context, tools, and a send gate. Personal chat products are fine for generic writing that does not include resident data.
              - heading "Will switching models break our workflows?" [level=3] [ref=f6e216]
              - paragraph [ref=f6e217]: "It will if prompts, tools, and gates are glued to one vendor’s features. It will not if the model is a component: stable tools, stable review steps, and an eval packet you re-run. innflow is built for that portability so a provider change is not a project to rebuild leasing."
              - heading "Can a model be the Fair Housing control?" [level=3] [ref=f6e218]
              - paragraph [ref=f6e219]: No. A model may help flag risky language. A qualified human remains accountable for housing decisions, screening outcomes, and eviction-related communication. That is not legal advice. Build the pause in the workflow even if the model is conservative.
              - heading "How do we keep this from becoming an IT-only project?" [level=3] [ref=f6e220]
              - paragraph [ref=f6e221]: Put operators on the review panel. If a community manager cannot see the run, the tools called, and the gate, the “platform” is still a lab account. Buy the canvas they will use on a Tuesday, then plug OpenAI, Anthropic, or both into it.
              - heading "Conclusion" [level=2] [ref=f6e222]
              - paragraph [ref=f6e223]:
                - strong [ref=f6e224]: OpenAI vs Anthropic
                - text: "is a model-provider choice, and it is worth running with your tickets and your tools. OpenAI often wins on ecosystem familiarity and mixed workloads. Anthropic often wins on long documents and careful instruction following. Those tendencies change as new models ship. What should not change is the operation: portable workflows, explicit gates, and a system of record that remains the PMS."
