<!doctype html><html><meta charset="utf-8"><title>Remaining homepage animations</title><style>body{font:15px system-ui;background:#f1f3f5;color:#172b40;margin:20px}h1{font-size:22px}canvas{height:75vh;width:auto;border-radius:18px}button,input,select{padding:9px;margin:4px}#status{white-space:pre-wrap}</style><h1>Homepage animation review</h1><nav><select id="scene"><option>06</option></select><select id="version"><option>after</option></select><button onclick="load()">Load</button><button onclick="p.play()">Play</button><button onclick="p.pause()">Pause</button><label>Seconds <input id="time" type="number" step="0.1" value="0" style="width:70px"></label><button onclick="pose()">Seek</button></nav><canvas id="art" width="771" height="830"></canvas><p id="status">Loading</p><script src="/node_modules/@rive-app/webgl2/rive.js"></script><script>
rive.RuntimeLoader.setWasmUrl('/node_modules/@rive-app/webgl2/rive.wasm');let p,entry,loops=0;const status=document.getElementById('status'),canvas=document.getElementById('art');async function load(){if(p)p.cleanup();loops=0;const n=document.getElementById('scene').value,v=document.getElementById('version').value;entry=(await(await fetch('/src/app/preview/scroll-showcase/homepage-storyboards.json')).json()).find(e=>e.number===+n);p=new rive.Rive({src:'/public/brand/homepage/06.riv?'+Date.now(),canvas,artboard:entry.artboard,stateMachines:entry.stateMachine,autoplay:true,layout:new rive.Layout({fit:rive.Fit.Contain}),onLoad:()=>{p.resizeDrawingSurfaceToCanvas();status.textContent='Loaded '+n+' '+v+' · '+entry.title;},onStateChange:e=>status.textContent='State machine running · '+JSON.stringify(e.data),onLoop:()=>status.textContent='Loop completed '+(++loops)+' · '+entry.title,onLoadError:e=>status.textContent='ERROR '+JSON.stringify(e)});}function pose(){p.pause();const t=+document.getElementById('time').value;p.scrub(entry.animation,t);status.textContent='Pose '+t+' seconds · '+entry.title;}load();</script></html>
